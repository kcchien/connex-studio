name: Windows Smoke Test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to smoke test (default: latest release)'
        required: false
        default: ''
  release:
    types: [published]

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Download installer from release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if ('${{ github.event_name }}' -eq 'release') { $tag = '${{ github.event.release.tag_name }}' }
          if ([string]::IsNullOrEmpty($tag)) {
            gh release download --repo ${{ github.repository }} --pattern '*setup*.exe' --dir installer
          } else {
            gh release download $tag --repo ${{ github.repository }} --pattern '*setup*.exe' --dir installer
          }
          Get-ChildItem installer

      - name: Silent install
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer -Filter '*.exe' | Select-Object -First 1
          Start-Process -FilePath $exe.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 10
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\connex-studio\Connex Studio.exe'
          if (-not (Test-Path $installed)) { throw "Installed binary not found at $installed" }
          Write-Host "Installed OK: $installed"

      - name: Launch and verify process stays alive
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\connex-studio\Connex Studio.exe'
          $proc = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 25
          $alive = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          $log = Join-Path $env:APPDATA 'connex-studio\logs\main.log'
          if (Test-Path $log) { Get-Content $log -Tail 30 }
          if (-not $alive) { throw 'App process exited within 25s' }
          if (-not (Test-Path $log)) { throw 'main.log not created' }
          $ready = Select-String -Path $log -Pattern 'Main window ready' -Quiet
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ready) { throw 'Main window ready not found in log' }
          Write-Host 'Smoke test passed: installed, launched, window ready'
